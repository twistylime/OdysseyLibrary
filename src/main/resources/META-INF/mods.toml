modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/twistylime/OdysseyLibrary/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "https://github.com/twistylime/OdysseyLibrary"
logoFile = "logo.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "SERVER"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "curios"
mandatory = false
versionRange = "[5.0,)"
ordering = "AFTER"
side = "SERVER"

[[dependencies."${mod_id}"]]
modId = "origins"
mandatory = false
versionRange = "[1.20.1-1.10.0.0,)"
ordering = "AFTER"
side = "SERVER"
